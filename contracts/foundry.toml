[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../node_modules", "lib"]
solc = "0.8.37"
auto_detect_solc = false
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
deny = "warnings"
ignored_error_codes = [2424, 4591, 6335, 8506]
fs_permissions = [{ access = "read", path = "../fixtures" }]

[profile.ci]
fuzz.runs = 1000
invariant.runs = 256
invariant.depth = 100
invariant.fail_on_revert = false

[profile.gas]
gas_reports = ["DueletStream"]

[profile.arc]
network = "arc"

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 128
depth = 64
fail_on_revert = false
shrink_run_limit = 5000

[rpc_endpoints]
arc_mainnet = "${ARC_MAINNET_RPC_URL}"
