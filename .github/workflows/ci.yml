name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install pinned Arc Foundry
        env:
          ARC_FOUNDRY_VERSION: v0.8.0-2
        run: |
          archive="arc-foundry-${ARC_FOUNDRY_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/circlefin/arc-foundry/releases/download/${ARC_FOUNDRY_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          mkdir -p "${RUNNER_TEMP}/arc-foundry"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/arc-foundry"
          echo "${RUNNER_TEMP}/arc-foundry" >> "${GITHUB_PATH}"

      - run: npm ci
      - run: npm run check
      - name: Verify real Arc USDC fork lifecycle
        env:
          ARC_MAINNET_RPC_URL: https://rpc.mainnet.arc.io
        run: npm run test:arc-fork --workspace @duelet/contracts
